version: '3.8'

services:
  dungeon-explorer-api:
    build:
      context: ./backend/DungeonExplorerBackend
      dockerfile: Dockerfile
    ports:
      - "8088:8080"
    env_file:
      - .env
    volumes:
      - sqlite_data:/app/data
    restart: unless-stopped

  dungeon-explorer-ui:
    build:
      context: ./frontend/dungeon-ui
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - dungeon-explorer-api
    restart: unless-stopped

volumes:
  sqlite_data:
